spring.application.name=vagaviva-api

server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.initialization-fail-timeout=-1

ia.url=${IA_URL:https://vagaviva-ia.onrender.com}
ia.timeout-ms=${IA_TIMEOUT_MS:2000}

jwt.secret=${JWT_SECRET:}

oferta.verificacao-ms=${OFERTA_VERIFICACAO_MS:300000}

cors.origins=${CORS_ORIGINS:http://localhost:5173}

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.time-zone=America/Sao_Paulo

server.error.whitelabel.enabled=false
server.error.include-stacktrace=never
server.error.include-message=never
spring.mvc.problemdetails.enabled=false

spring.config.import=optional:file:./.env[.properties]